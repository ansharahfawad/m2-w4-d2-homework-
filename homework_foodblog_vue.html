<!doctype html>
<html lang="en">
  <head>
    <title>Food Blog</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <aside id="leftside" aria-hidden="true"></aside>
    <aside id="rightside" aria-hidden="true"></aside>

    <div id="container" class="container-fluid px-0 my-4">
      <header
        class="d-flex flex-wrap align-items-center justify-content-between"
      >
        <food-blog-title></food-blog-title>
        <food-blog-nav></food-blog-nav>
      </header>

      <main class="row no-gutters">
        <aside id="photos" class="col-12 col-md-3">
          <img
            :src="chiliImage"
            alt="White Chicken Chili"
            class="img-fluid chili-image"
          />
        </aside>

        <div class="col-12 col-md-9 p-4 content-column">
          <comments-heading></comments-heading>
          <section id="blogposts">
            <blog-post
              v-for="post in posts"
              :key="post.id"
              :post="post"
              :profile-placeholder="profilePlaceholder"
              @show-author-info="showAuthorInfo"
            >
            </blog-post>
          </section>
        </div>
      </main>

      <div
        v-if="selectedAuthor"
        class="profile-overlay"
        @click.self="closeAuthorInfo"
      >
        <section
          class="profile-card"
          role="dialog"
          aria-modal="true"
          :aria-label="selectedAuthor.name + ' profile'"
        >
          <button
            class="profile-close"
            type="button"
            @click="closeAuthorInfo"
            aria-label="Close profile"
          >
            ×
          </button>
          <h3>{{ selectedAuthor.name }}</h3>
          <p><strong>Foodie Level:</strong> {{ selectedAuthor.foodieLevel }}</p>
          <p><strong>Bio:</strong> {{ selectedAuthor.bio }}</p>
        </section>
      </div>

      <footer>&copy; Copyright FOOD BLOG</footer>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
